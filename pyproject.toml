[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-pulse"
version = "0.1.0"
description = "Quick health stats for any local git repository"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repo-pulse = "repo_pulse.cli:main"

[tool.setuptools]
packages = ["repo_pulse"]
